<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>toto勝敗予想システム</title>
<meta name="description" content="toto／mini toto A組・B組／totoGOAL3／totoGOAL2 のAI勝敗・得点予想（閲覧専用）">
<meta name="theme-color" content="#16324f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="toto予想">
<style>
  :root { --blue:#2f6fed; --ink:#16324f; --sub:#6b7a8d; --line:#d6dbe3; --bg:#f6f8fb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#16324f,#2f6fed); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:1.15rem; }
  header .meta { font-size:.75rem; opacity:.85; margin-top:4px; }
  nav { display:flex; gap:6px; padding:10px 12px; overflow-x:auto; position:sticky; top:0;
        background:#fff; border-bottom:1px solid var(--line); z-index:5; }
  nav button { border:1px solid var(--line); background:#fff; border-radius:999px;
               padding:7px 14px; font-size:.85rem; white-space:nowrap; cursor:pointer; }
  nav button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  main { max-width:960px; margin:0 auto; padding:12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px;
          padding:12px 14px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th,td { border-bottom:1px solid var(--line); padding:6px 4px; text-align:center; }
  th { background:#f2f5fa; color:var(--sub); font-size:.75rem; }
  td.l { text-align:left; }
  .bar { height:8px; border-radius:4px; background:#eef1f6; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .bar.g i { background:#c7cfd8; }
  .tag { display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:999px;
         background:#e8f0ff; color:var(--blue); margin-left:4px; }
  .warn { color:#e5484d; font-weight:700; }
  .muted { color:var(--sub); font-size:.78rem; }
  .btn { border:0; border-radius:10px; padding:10px 16px; font-size:.9rem; cursor:pointer;
         background:var(--blue); color:#fff; }
  .btn.sub { background:#eef1f6; color:var(--ink); }
  .btn.danger { background:#e5484d; }
  input[type=number],input[type=text],textarea,select { width:100%; padding:8px;
         border:1px solid var(--line); border-radius:8px; font-size:.9rem; }
  textarea { min-height:64px; }
  details { border:1px solid var(--line); border-radius:10px; margin:6px 0; background:#fff; }
  details summary { padding:10px 12px; cursor:pointer; font-size:.88rem; }
  details .in { padding:0 12px 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} }
  .mark { display:inline-block; width:26px; height:26px; line-height:26px; border-radius:50%;
          color:#fff; font-weight:700; font-size:.8rem; text-align:center; }
  .m1{background:#e5484d}.m0{background:#f5a524}.m2{background:#12a150}
  .msheet table{font-size:.8rem}
  .level { font-size:2rem; font-weight:800; color:var(--blue); }
  canvas{max-width:100%}
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
           background:var(--ink); color:#fff; padding:10px 18px; border-radius:10px;
           font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:99;}
  .toast.show{opacity:.95}
  .autobar { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
             padding:8px 12px; background:#fff; border-bottom:1px solid var(--line);
             font-size:.8rem; position:sticky; top:0; z-index:6; }
  .autobar .st { color:var(--sub); }
  .autobar details { flex-basis:100%; }
  .autobar details summary { padding:6px 0; font-size:.78rem; color:var(--sub); }
  .msheet .mcheck-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
                        margin:4px 0 10px; font-size:.85rem; }
  .msheet.check-on td .mark { cursor:pointer; position:relative; }
  .msheet.check-on td .mark.ck::after { content:"✓"; position:absolute; inset:-4px;
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:800; font-size:.95rem; text-shadow:0 0 4px #000; }
</style>
</head>
<body>
<header>
  <div class="row" style="justify-content:space-between;align-items:center">
    <div>
      <h1>⚽ toto勝敗予想システム</h1>
      <div class="meta" id="hdr-meta">読み込み中…</div>
    </div>
    <button id="btn-manual" class="btn" style="background:rgba(255,255,255,.18);color:#fff">📖 使い方</button>
  </div>
</header>
<nav id="gametabs"></nav>
<div class="autobar" id="autobar"></div>
<main id="app"><div class="card muted">データを読み込んでいます…</div></main>
<div class="toast" id="toast"></div>
<div id="manual-overlay" style="display:none;position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:100;overflow-y:auto;padding:16px">
  <div class="card" style="max-width:640px;margin:20px auto;position:relative">
    <button id="manual-close" class="btn danger" style="position:absolute;top:10px;right:10px">✕ 閉じる</button>
    <div id="manual-body"></div>
  </div>
</div>
<script src="app.js?v=1795654405"></script>
</body>
</html>
